name: Android APK Release

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  APK_VERSION: 0.0.1_poc
  APK_NAME: SharpEmu-Android-0.0.1_poc.apk

jobs:
  build-and-release:
    name: Build and publish Android APK
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.103

      - name: Install Android workload
        run: dotnet workload install android

      # Always build clean and in Release: the Gradle library (.aar) is a static
      # dependency of the .NET Android app project (AndroidLibrary item), and
      # stale outputs from a previous run would silently ship old Kotlin UI code.
      - name: Clean Gradle build outputs
        shell: bash
        run: rm -rf platform/android/app/build platform/android/.gradle

      - name: Build Kotlin/Compose library (.aar)
        working-directory: platform/android
        shell: bash
        run: ./gradlew :app:assembleRelease

      - name: Clean .NET Android build outputs
        shell: bash
        run: rm -rf artifacts/obj/SharpEmu.Android artifacts/bin/Release/net10.0-android

      - name: Build Android APK (Release)
        run: dotnet build src/SharpEmu.Android/SharpEmu.Android.csproj -c Release -f net10.0-android

      - name: Rename APK artifact
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find artifacts/bin/Release/net10.0-android -iname '*-Signed.apk' | head -n1)"
          test -n "$apk"
          cp "$apk" "$APK_NAME"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: sharpemu-android-${{ env.APK_VERSION }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Create or update release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="android-v${APK_VERSION}"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$APK_NAME" --clobber
          else
            gh release create "$tag" "$APK_NAME" \
              --title "SharpEmu Android ${APK_VERSION}" \
              --notes "Automated Android proof-of-concept build (${APK_VERSION})." \
              --target "$GITHUB_SHA"
          fi
